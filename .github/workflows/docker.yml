# Build and test the image on every push to main and every pull request.
# On a push to main whose VERSION file holds a version not released yet (no
# tag v<version>), also push the image to ghcr.io (<version> and latest),
# tag that commit and publish a GitHub release with the image archives of
# every platform. An unchanged VERSION only builds and tests.

name: Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
    - uses: actions/checkout@v7

    - name: Version
      id: version
      run: |
        version=$(tr -d '[:space:]' < VERSION)
        if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
          echo "::error file=VERSION::invalid version '$version': expected MAJOR.MINOR or MAJOR.MINOR.PATCH"
          exit 1
        fi
        release=false
        if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
          # --exit-code: 0 = tag exists, 2 = no such tag, else a git error.
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null || rc=$?
          case $rc in
            0) echo "v$version is already released: build only" ;;
            2) echo "v$version is new: it will be released"; release=true ;;
            *) echo "::error::cannot list the tags of origin (git exit code $rc)"; exit 1 ;;
          esac
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "release=$release" >> "$GITHUB_OUTPUT"

    - uses: docker/setup-buildx-action@v3

    # Scripts, compose.yaml and version consistency.
    - name: Check
      run: make check

    # The image for this machine, deployed with compose.yaml.
    - name: Test
      run: make test

    - name: Package
      run: make package

    - uses: actions/upload-artifact@v4
      with:
        name: airtg-collector-${{ steps.version.outputs.version }}
        path: |
          dist/*.tar.gz
          dist/SHA256SUMS
        if-no-files-found: error

  release:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the tag and the release
      packages: write   # push the image to ghcr.io
    # Releases never run concurrently, so two quick pushes cannot race.
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      TAG: v${{ needs.build.outputs.version }}
    steps:
    - uses: actions/checkout@v7

    - uses: actions/download-artifact@v8
      with:
        name: airtg-collector-${{ needs.build.outputs.version }}
        path: dist

    - name: Already released?
      id: released
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Checked again: another run may have released it meanwhile.
        if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          echo "$TAG already released"
          echo "released=true" >> "$GITHUB_OUTPUT"
        fi

    - uses: docker/setup-buildx-action@v3
      if: steps.released.outputs.released != 'true'

    - uses: docker/login-action@v4
      if: steps.released.outputs.released != 'true'
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Push the image
      if: steps.released.outputs.released != 'true'
      run: make push

    - name: Create tag and release
      if: steps.released.outputs.released != 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.build.outputs.version }}
      run: |
        poller=$(sed -n 's/^ARG SNMP_POLLER_VERSION=//p' Dockerfile)
        cat > notes.md <<EOF
        Image: \`ghcr.io/airtg-io/airtg-collector:$VERSION\` (linux/amd64, linux/arm64)

        | Component | Version |
        |-----------|---------|
        | snmp-poller | [v$poller](https://github.com/airtg-io/snmp-poller/releases/tag/v$poller) |

        Without registry access: \`gunzip -c airtg-collector-$VERSION-linux-<arch>.tar.gz | docker load\`.
        EOF
        gh release create "$TAG" dist/* \
          --repo "$GITHUB_REPOSITORY" \
          --target "$GITHUB_SHA" \
          --title "AIrtg collector $TAG" \
          --notes-file notes.md \
          --generate-notes
